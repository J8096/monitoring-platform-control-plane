name: CI — Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────
  # 1. BACKEND TESTS
  # ─────────────────────────────────────────────────
  test-backend:
    name: Backend E2E Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Run E2E tests
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-sentinel' }}
          MONGO_URI: mongodb://127.0.0.1:27017/sentinel-test
        run: npm test

  # ─────────────────────────────────────────────────
  # 2. FRONTEND BUILD CHECK
  # ─────────────────────────────────────────────────
  build-frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Build
        env:
          VITE_USE_MOCK_DATA: "true"
          VITE_API_URL: "https://placeholder.onrender.com/api"
          VITE_WS_URL: "https://placeholder.onrender.com"
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ─────────────────────────────────────────────────
  # 3. DEPLOY — only on push to main after tests pass
  # ─────────────────────────────────────────────────
  deploy:
    name: Trigger Deploy
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail-with-body
        continue-on-error: true

      - name: Deploy summary
        run: |
          echo "✅ Tests passed on main"
          echo "   Backend: Render auto-deploys from GitHub"
          echo "   Frontend: Vercel auto-deploys from GitHub"
